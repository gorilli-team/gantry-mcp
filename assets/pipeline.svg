<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Gantry pipeline: an agent's tool call passes audit, rateLimit, timeout, idempotency, approval, annotations and outputLimit before the handler; any module can return a refusal the agent can act on">
<title>Gantry pipeline</title>
<style>
  .bg{fill:#E4E8F2} .ink{fill:#141A33} .muted{fill:#4A5372} .box{fill:#FFFFFF;stroke:#C5CBDD}
  .mod{fill:#FFFFFF;stroke:#2F4FA0} .modhl{fill:#FFF7DD;stroke:#D9A21B} .modtext{fill:#141A33} .line{stroke:#4A5372} .ref{stroke:#D9A21B}
  @media (prefers-color-scheme: dark) {
    .bg{fill:#0B0F20} .ink{fill:#F5F7FC} .muted{fill:#AEB6CF} .box{fill:#161D38;stroke:#2B3560}
    .mod{fill:#141B36;stroke:#4C72CF} .modhl{fill:#2A2410;stroke:#F2C94C} .modtext{fill:#E4E8F2} .line{stroke:#AEB6CF}
  }
  text{font-family:Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7A84A3"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#D9A21B"/></marker>
  <clipPath id="av"><circle cx="1136" cy="58" r="38"/></clipPath>
</defs>
<rect class="bg" width="1200" height="340" rx="18"/>
<rect x="0" y="0" width="1200" height="8" rx="4" fill="#F2C94C"/>
<text class="ink" x="40" y="54" font-size="21" font-weight="800">One pipeline around every tools/call</text>
<text class="muted" x="40" y="82" font-size="14">Each module calls next() or returns its own result. Refusals come back to the agent as tool results it can act on.</text>
<circle cx="1136" cy="58" r="38" fill="#B4BACE"/>
<image href="data:image/webp;base64," x="1094" y="18" width="84" height="84" clip-path="url(#av)"/>
<circle cx="1136" cy="58" r="38" fill="none" stroke="#F2C94C" stroke-width="3"/>
<rect class="box" x="30" y="136" width="96" height="76" rx="14"/>
<text class="ink" x="78" y="170" font-size="16" font-weight="700" text-anchor="middle">Agent</text>
<text class="muted" x="78" y="191" font-size="12" text-anchor="middle">tools/call</text>
<rect class="mod" x="150" y="136" width="118" height="76" rx="14" stroke-width="1.5"/>
<text class="modtext" x="209" y="170" font-size="14" font-weight="700" text-anchor="middle">audit</text>
<text class="muted" x="209" y="191" font-size="12" text-anchor="middle">log it</text>
<rect class="mod" x="280" y="136" width="118" height="76" rx="14" stroke-width="1.5"/>
<text class="modtext" x="339" y="170" font-size="14" font-weight="700" text-anchor="middle">rateLimit</text>
<text class="muted" x="339" y="191" font-size="12" text-anchor="middle">cap it</text>
<rect class="mod" x="410" y="136" width="118" height="76" rx="14" stroke-width="1.5"/>
<text class="modtext" x="469" y="170" font-size="14" font-weight="700" text-anchor="middle">timeout</text>
<text class="muted" x="469" y="191" font-size="12" text-anchor="middle">stop it</text>
<rect class="mod" x="540" y="136" width="118" height="76" rx="14" stroke-width="1.5"/>
<text class="modtext" x="599" y="170" font-size="14" font-weight="700" text-anchor="middle">idempotency</text>
<text class="muted" x="599" y="191" font-size="12" text-anchor="middle">once only</text>
<rect class="modhl" x="670" y="136" width="118" height="76" rx="14" stroke-width="1.5"/>
<text class="modtext" x="729" y="170" font-size="14" font-weight="700" text-anchor="middle">approval</text>
<text class="muted" x="729" y="191" font-size="12" text-anchor="middle">ask a human</text>
<rect class="mod" x="800" y="136" width="118" height="76" rx="14" stroke-width="1.5"/>
<text class="modtext" x="859" y="170" font-size="14" font-weight="700" text-anchor="middle">annotations</text>
<text class="muted" x="859" y="191" font-size="12" text-anchor="middle">guard it</text>
<rect class="mod" x="930" y="136" width="118" height="76" rx="14" stroke-width="1.5"/>
<text class="modtext" x="989" y="170" font-size="14" font-weight="700" text-anchor="middle">outputLimit</text>
<text class="muted" x="989" y="191" font-size="12" text-anchor="middle">trim it</text>
<rect class="box" x="1068" y="136" width="102" height="76" rx="14"/>
<text class="ink" x="1119" y="170" font-size="16" font-weight="700" text-anchor="middle">Handler</text>
<text class="muted" x="1119" y="191" font-size="12" text-anchor="middle">your tool</text>
<line class="line" x1="127" y1="174" x2="148" y2="174" stroke-width="1.5" marker-end="url(#a)"/>
<line class="line" x1="269" y1="174" x2="278" y2="174" stroke-width="1.5" marker-end="url(#a)"/>
<line class="line" x1="399" y1="174" x2="408" y2="174" stroke-width="1.5" marker-end="url(#a)"/>
<line class="line" x1="529" y1="174" x2="538" y2="174" stroke-width="1.5" marker-end="url(#a)"/>
<line class="line" x1="659" y1="174" x2="668" y2="174" stroke-width="1.5" marker-end="url(#a)"/>
<line class="line" x1="789" y1="174" x2="798" y2="174" stroke-width="1.5" marker-end="url(#a)"/>
<line class="line" x1="919" y1="174" x2="928" y2="174" stroke-width="1.5" marker-end="url(#a)"/>
<line class="line" x1="1049" y1="174" x2="1066" y2="174" stroke-width="1.5" marker-end="url(#a)"/>
<path class="ref" d="M729 214 V268 H78 V216" fill="none" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#r)"/>
<text class="ink" x="200" y="296" font-size="14" font-weight="700">Refusal: isError + structuredContent.gantry.code</text>
<text class="muted" x="200" y="318" font-size="13">APPROVAL_REQUIRED, RATE_LIMITED, TIMEOUT, DUPLICATE_IN_FLIGHT, ANNOTATION_VIOLATION, UNAVAILABLE ...</text>
</svg>
