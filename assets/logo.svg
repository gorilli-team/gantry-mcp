<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Gantry logo">
  <title>Gantry</title>
  <rect width="64" height="64" rx="14" fill="#0F172A"/>
  <!-- beam -->
  <rect x="9" y="13" width="46" height="7" rx="2" fill="#EA580C"/>
